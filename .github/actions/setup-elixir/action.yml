name: Setup Elixir
description: Install Erlang/Elixir from .tool-versions and pin Hex (2.5.1-dev until released)
inputs:
  version-file:
    description: Path to .tool-versions or mise.toml
    required: false
    default: .tool-versions
outputs:
  otp-version:
    description: Installed OTP version
    value: ${{ steps.setup-beam.outputs.otp-version }}
  elixir-version:
    description: Installed Elixir version
    value: ${{ steps.setup-beam.outputs.elixir-version }}
runs:
  using: composite
  steps:
    - id: setup-beam
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        version-file: ${{ inputs.version-file }}
        version-type: strict

    - name: Install Hex
      shell: bash
      run: ./etc/scripts/install_hex.sh
