# CI workflow for Pull Requests
# Runs tests, linter, and mix deps.audit in parallel without deploying

name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Install dependencies
        run: mix deps.get

      - name: Clean removed LiveView Native build artifacts
        run: mix deps.clean live_view_native live_view_native_swiftui live_view_native_stylesheet live_view_native_live_form --build

      - name: Compile
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
        run: mix coveralls.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          fail_ci_if_error: false
          verbose: true

  shell:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt

      - name: ShellCheck
        run: find . -type f -name '*.sh' -not -path './_build/*' -not -path './deps/*' -exec shellcheck {} +

      - name: shfmt (format check)
        run: |
          scripts=$(find . -type f -name '*.sh' -not -path './_build/*' -not -path './deps/*')
          if [ -n "$scripts" ]; then shfmt -d -i 2 -ci $scripts; fi

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-format-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-

      - name: Install dependencies
        run: mix deps.get

      - name: Check format
        run: mix format --check-formatted

  credo:
    name: Code Quality (Credo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-credo-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-credo-

      - name: Install dependencies
        run: mix deps.get

      - name: Clean removed LiveView Native build artifacts
        run: mix deps.clean live_view_native live_view_native_swiftui live_view_native_stylesheet live_view_native_live_form --build

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-security-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-security-

      - name: Install dependencies
        run: mix deps.get

      - name: Clean removed LiveView Native build artifacts
        run: mix deps.clean live_view_native live_view_native_swiftui live_view_native_stylesheet live_view_native_live_form --build

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Dependency audit
        run: mix deps.audit
