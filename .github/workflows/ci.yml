# CI workflow for Pull Requests
# Runs tests, linter, and mix deps.audit in parallel without deploying

name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  build_test:
    name: Build (test env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        env:
          MIX_ENV: test
        run: |
          mix clean
          mix deps.compile
          mix compile --warnings-as-errors

      # Shared with test/query_explain_pr/email_previews_pr so the test-env compile
      # only happens once per run instead of once per job.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-test-${{ github.run_id }}
          path: |
            deps
            _build/test
          retention-days: 1

  build_dev:
    name: Build (dev env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      # Shared with credo/dialyzer/security so the dev-env compile only happens
      # once per run instead of once per job.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-dev-${{ github.run_id }}
          path: |
            deps
            _build/dev
          retention-days: 1

  test:
    name: Tests
    needs: build_test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-test-${{ github.run_id }}

      # GHA service containers do not pass `server /data` to the MinIO image, so the
      # container exits immediately (help text only) and the health check never passes.
      # Start MinIO explicitly on the runner (same image as etc/docker/docker-compose).
      - name: Start MinIO and create buckets
        run: |
          docker rm -f minio_ci 2>/dev/null || true
          docker run -d --name minio_ci -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-03-12T18-04-18Z@sha256:46b3009bf7041eefbd90bd0d2b38c6ddc24d20a35d609551a1802c558c1c958f \
            server /data --console-address ":9001"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123 \
            -c "
              mc alias set local http://127.0.0.1:9000 minioadmin minioadmin &&
              mc mb local/media --ignore-existing &&
              mc mb local/expense-reports --ignore-existing &&
              mc mb local/app-resources --ignore-existing &&
              mc mb local/avatars --ignore-existing &&
              mc anonymous set public local/media &&
              mc anonymous set public local/avatars
            "

      - name: Run tests with coverage
        env:
          MIX_ENV: test
        run: mix coveralls.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          fail_ci_if_error: false
          verbose: true

  shell:
    # Name must match the "Shell Scripts" required check in the Protect Main ruleset.
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt

      - name: Install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: |
          mapfile -t scripts < <(./etc/scripts/list_lintable_shell_scripts.sh)
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi

      - name: shfmt (format check)
        run: |
          mapfile -t scripts < <(./etc/scripts/list_lintable_shell_scripts.sh)
          if [ "${#scripts[@]}" -gt 0 ]; then shfmt -d -i 2 -ci "${scripts[@]}"; fi

      - name: dprint (format check)
        run: dprint check

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check format
        run: mix format --check-formatted

  credo:
    name: Code Quality (Credo)
    needs: build_dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dev-${{ github.run_id }}

      - name: Run Credo
        run: mix credo --strict

  dialyzer:
    name: Dialyzer
    needs: build_dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore PLT cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-plt-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-plt-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dev-${{ github.run_id }}

      - name: Run Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --plt
          mix dialyzer

  security:
    name: Security Checks
    needs: build_dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dev-${{ github.run_id }}

      - name: Hex audit (retired packages and advisories)
        run: mix hex.audit

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Dependency audit
        run: mix deps.audit --ignore-file config/mix_audit.ignore

      - name: Check unused deps
        run: mix deps.unlock --check-unused

  # For pull_request from forks, GITHUB_TOKEN is read-only; PR comments may fail unless
  # you use a PAT secret or a different trigger. Same-repo PRs work with defaults.
  query_explain_pr:
    name: PR Query EXPLAIN
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-test-${{ github.run_id }}

      - name: Prepare test database
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix run priv/repo/test_seeds.exs

      - name: Run PR query EXPLAIN
        id: explain
        env:
          MIX_ENV: test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash etc/scripts/ci/pr_query_explain.sh

      - name: Find query-explain comment
        id: find
        if: steps.explain.outputs.skip != 'true'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- ci-query-explain -->"

      - name: Create or update PR comment
        if: steps.explain.outputs.skip != 'true'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: ${{ steps.explain.outputs.comment_path }}
          edit-mode: replace

  # Sticky PR comment with screenshots when email templates change.
  # Fork PRs: GITHUB_TOKEN cannot push the preview branch or always comment; artifacts still upload.
  email_previews_detect:
    name: PR Email Previews (detect)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect email template changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EMAIL_PREVIEWS_DETECT_ONLY: "true"
        run: bash etc/scripts/ci/pr_email_previews.sh

  email_previews_pr:
    name: PR Email Previews
    needs: [email_previews_detect, build_test]
    if: needs.email_previews_detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: email-previews-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-test-${{ github.run_id }}

      - name: Prepare test database
        env:
          MIX_ENV: test
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix run priv/repo/test_seeds.exs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        id: playwright
        run: |
          PW_DIR="${RUNNER_TEMP}/playwright-email-previews"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          npm init -y >/dev/null
          npm install --no-fund --no-audit playwright@1.52.0
          npx playwright install chromium --with-deps
          echo "dir=$PW_DIR" >>"$GITHUB_OUTPUT"

      - name: Render and screenshot email previews
        id: previews
        env:
          MIX_ENV: test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAN_PUSH_PREVIEW_BRANCH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PLAYWRIGHT_NODE_PATH: ${{ steps.playwright.outputs.dir }}/node_modules
        run: bash etc/scripts/ci/pr_email_previews.sh

      - name: Upload preview artifacts
        if: steps.previews.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: email-previews-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ steps.previews.outputs.previews_dir }}/*.png
            ${{ steps.previews.outputs.previews_dir }}/*.html
            ${{ steps.previews.outputs.previews_dir }}/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Find email-previews comment
        id: find
        if: steps.previews.outputs.skip != 'true'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- ci-email-previews -->"

      - name: Create or update PR comment
        if: steps.previews.outputs.skip != 'true'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: ${{ steps.previews.outputs.comment_path }}
          edit-mode: replace
