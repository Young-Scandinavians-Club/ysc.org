# Production deploy: runs when a version tag is pushed (e.g. v1.2.3). The tagged
# commit must already be on origin/main. Uses etc/fly/fly-prod.toml (app: ysc-prod).
#
# Requires secrets:
# - FLY_PROD_API_TOKEN (production Fly org; not sandbox)
# - OPENROUTER_API_KEY (optional; skips LLM release notes + committee email without it)
# - RESEND_API_KEY (optional unless LLM notes run; notifies ysc-web-committee@googlegroups.com)

name: Deploy Production
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests and generate lcov report
        env:
          MIX_ENV: test
        run: mix coveralls.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          fail_ci_if_error: false
          verbose: true

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-format-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-

      - name: Install dependencies
        run: mix deps.get

      - name: Check format
        run: mix format --check-formatted

  credo:
    name: Code Quality (Credo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-credo-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-credo-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.4"
          otp-version: "27.3"

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-security-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-security-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Dependency audit
        run: mix deps.audit

  deploy:
    name: Deploy app production
    runs-on: ubuntu-latest
    needs: [test, formatting, credo, security]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node 24 runtime (post v1.5)

      - name: Verify Fly token can access production app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-prod

      # Starts any auto-stopped machines, then scale count 2 if still short (see etc/scripts/fly_ensure_min_started_machines.sh).
      - name: Ensure at least two started machines (rolling deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
        run: bash etc/scripts/fly_ensure_min_started_machines.sh ysc-prod 2

      - name: Deploy to Fly.io production
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION="${VERSION_TAG}-${GIT_HASH}"
          flyctl deploy \
            --dockerfile etc/docker/Dockerfile \
            -a ysc-prod \
            -c etc/fly/fly-prod.toml \
            --local-only \
            --build-arg BUILD_VERSION="$VERSION" \
            --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}

  # Merged PRs since the previous v* tag → OpenRouter (LLM) → create/update GitHub release body
  release_notes:
    name: Update GitHub release notes
    runs-on: ubuntu-latest
    needs: [test, formatting, credo, security]
    outputs:
      llm_notes: ${{ steps.generate_release_notes.outputs.llm_notes }}
    permissions:
      contents: write
    steps:
      - name: Checkout (tags)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate and publish release notes
        id: generate_release_notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "llm_notes=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY secret is not set; skipping release notes."
            exit 0
          fi
          bash etc/scripts/update_github_release_notes.sh
          echo "llm_notes=true" >> "$GITHUB_OUTPUT"

  notify_committee:
    name: Email web committee release notes
    runs-on: ubuntu-latest
    needs: [deploy, release_notes]
    if: ${{ needs.release_notes.outputs.llm_notes == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Send committee email via Resend
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bash etc/scripts/notify_release_committee_resend.sh
