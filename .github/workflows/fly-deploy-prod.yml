# Production deploy: runs when a version tag is pushed (e.g. v1.2.3). The tagged
# commit must already be on origin/main. Uses etc/fly/fly-prod.toml (app: ysc-prod).
#
# Also deploys query_console/ to ysc-query-console-sandbox then ysc-query-console.
#
# CI (tests, format, credo, security) is not duplicated here: the same commit was
# already validated when it landed on main (.github/workflows/fly-deploy.yml).
# This workflow deploys sandbox first, then production — if sandbox deploy fails,
# production does not run. Sandbox deploy uses the shared deploy-sandbox concurrency
# group with cancel-in-progress: true so release deploys win over CI sandbox deploys.
#
# flyctl is installed via .github/actions/setup-flyctl (retrying bash), not
# superfly/flyctl-actions — that Node 24 action can fail in ~1s with no logs.
#
# Requires secrets:
# - FLY_SANDBOX_API_TOKEN or FLY_API_TOKEN (sandbox gate deploy before prod)
# - FLY_PROD_API_TOKEN (production Fly org; not sandbox)
# - OPENROUTER_API_KEY (optional; skips LLM release notes + committee email without it)
# - RESEND_API_KEY (optional unless LLM notes run; notifies ysc-web-committee@googlegroups.com)

name: Deploy Production
on:
  push:
    tags:
      - "v*"

jobs:
  deploy_sandbox:
    name: Deploy app sandbox (gate before prod)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - uses: ./.github/actions/setup-flyctl

      - name: Verify Fly token can access sandbox app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-sandbox

      - name: Deploy to Fly.io sandbox
        run: |
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$VERSION_TAG" ]; then
            COMMITS=$(git rev-list --count "${VERSION_TAG}..HEAD")
            VERSION="${VERSION_TAG}-${COMMITS}-${GIT_HASH}"
          else
            VERSION="unknown-${GIT_HASH}"
          fi
          flyctl deploy --dockerfile etc/docker/Dockerfile -a ysc-sandbox -c etc/fly/fly-sandbox.toml --local-only --build-arg BUILD_VERSION="$VERSION" --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}

  deploy_query_console_sandbox:
    name: Deploy query console sandbox (gate before prod)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-query-console-sandbox
      cancel-in-progress: true
    defaults:
      run:
        working-directory: query_console
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        working-directory: .
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - uses: ./.github/actions/setup-flyctl

      - name: Verify Fly token can access query console sandbox
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-query-console-sandbox

      - name: Deploy query console to Fly.io sandbox
        run: |
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$VERSION_TAG" ]; then
            COMMITS=$(git rev-list --count "${VERSION_TAG}..HEAD")
            VERSION="${VERSION_TAG}-${COMMITS}-${GIT_HASH}"
          else
            VERSION="unknown-${GIT_HASH}"
          fi
          flyctl deploy -a ysc-query-console-sandbox -c fly.sandbox.toml --local-only --build-arg BUILD_VERSION="$VERSION" --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}

  deploy_query_console_prod:
    name: Deploy query console production
    runs-on: ubuntu-latest
    needs: [deploy_query_console_sandbox]
    concurrency:
      group: deploy-query-console-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: query_console
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flyctl

      - name: Verify Fly token can access query console production
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-query-console

      - name: Deploy query console to Fly.io production
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION="${VERSION_TAG}-${GIT_HASH}"
          flyctl deploy \
            -a ysc-query-console \
            -c fly.prod.toml \
            --local-only \
            --build-arg BUILD_VERSION="$VERSION" \
            --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}

  deploy:
    name: Deploy app production
    runs-on: ubuntu-latest
    needs: [deploy_sandbox]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flyctl

      - name: Verify Fly token can access production app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-prod

      # Starts any auto-stopped machines, then scale count 2 if still short (see etc/scripts/fly_ensure_min_started_machines.sh).
      - name: Ensure at least two started machines (rolling deploy)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}
        run: bash etc/scripts/fly_ensure_min_started_machines.sh ysc-prod 2

      - name: Deploy to Fly.io production
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION="${VERSION_TAG}-${GIT_HASH}"
          flyctl deploy \
            --dockerfile etc/docker/Dockerfile \
            -a ysc-prod \
            -c etc/fly/fly-prod.toml \
            --local-only \
            --build-arg BUILD_VERSION="$VERSION" \
            --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}

  # Merged PRs since the previous v* tag → OpenRouter (LLM) → create/update GitHub release body
  release_notes:
    name: Update GitHub release notes
    runs-on: ubuntu-latest
    needs: [deploy_sandbox]
    outputs:
      llm_notes: ${{ steps.generate_release_notes.outputs.llm_notes }}
    permissions:
      contents: write
    steps:
      - name: Checkout (tags)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate and publish release notes
        id: generate_release_notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "llm_notes=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY secret is not set; skipping release notes."
            exit 0
          fi
          bash etc/scripts/update_github_release_notes.sh
          echo "llm_notes=true" >> "$GITHUB_OUTPUT"

  notify_committee:
    name: Email web committee release notes
    runs-on: ubuntu-latest
    needs: [deploy, release_notes]
    if: ${{ needs.release_notes.outputs.llm_notes == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Send committee email via Resend
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bash etc/scripts/notify_release_committee_resend.sh
