# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# CI runs tests, linter, and mix deps.audit in parallel; deploy only runs if all CI passes on main branch.
# Production: tag push (v*) → .github/workflows/fly-deploy-prod.yml (sandbox deploy gate, then prod; CI not duplicated there).
# If a v* tag already points at the commit after CI, the Fly deploy job is skipped so only Deploy
# Production deploys sandbox (one deploy, no duplicate work). The gate job still runs so branch checks stay green.
# Only deploy_sandbox uses the deploy-sandbox concurrency group — the gate job must not, or it cancels
# in-progress Deploy Production sandbox deploys on release (main push + tag push from release.sh).
# CI deploy_sandbox uses cancel-in-progress: false so a release deploy is never cancelled by CI;
# Deploy Production keeps cancel-in-progress: true and wins the shared deploy-sandbox group.
#
# Query console (query_console/) deploys in parallel: ysc-query-console-sandbox on main,
# ysc-query-console on v* tags (see deploy_query_console_* jobs).
#
# Secrets: use FLY_SANDBOX_API_TOKEN for the sandbox Fly org (recommended). If unset, FLY_API_TOKEN
# is used so existing repos keep working — do not point FLY_API_TOKEN at production.

name: CI and Deploy Sandbox
on:
  push:
    branches:
      - main

# Cancel superseded runs when main moves on (e.g. merge immediately before release.sh).
# Without this, a stale run can finish CI and reach deploy_sandbox after a newer push/tag.
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build (test env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        env:
          MIX_ENV: test
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      # Shared with the test job so the test-env compile only happens once per run.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-test-${{ github.run_id }}
          path: |
            deps
            _build/test
          retention-days: 1

  build_dev:
    name: Build (dev env)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      # Shared with credo/security so the dev-env compile only happens once per run.
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-dev-${{ github.run_id }}
          path: |
            deps
            _build/dev
          retention-days: 1

  test:
    name: Tests
    needs: build_test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-test-${{ github.run_id }}

      # GHA service containers do not pass `server /data` to the MinIO image, so the
      # container exits immediately (help text only) and the health check never passes.
      # Start MinIO explicitly on the runner (same image as etc/docker/docker-compose).
      # Kept in sync with the identical step in ci.yml.
      - name: Start MinIO and create buckets
        run: |
          docker rm -f minio_ci 2>/dev/null || true
          docker run -d --name minio_ci -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-03-12T18-04-18Z@sha256:46b3009bf7041eefbd90bd0d2b38c6ddc24d20a35d609551a1802c558c1c958f \
            server /data --console-address ":9001"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123 \
            -c "
              mc alias set local http://127.0.0.1:9000 minioadmin minioadmin &&
              mc mb local/media --ignore-existing &&
              mc mb local/expense-reports --ignore-existing &&
              mc mb local/app-resources --ignore-existing &&
              mc mb local/avatars --ignore-existing &&
              mc anonymous set public local/media &&
              mc anonymous set public local/avatars
            "

      - name: Run tests and generate lcov report
        env:
          MIX_ENV: test
        run: mix coveralls.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          fail_ci_if_error: false
          verbose: true

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check format
        run: mix format --check-formatted

  credo:
    name: Code Quality (Credo)
    needs: build_dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dev-${{ github.run_id }}

      - name: Run Credo
        run: mix credo --strict

  security:
    name: Security Checks
    needs: build_dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dev-${{ github.run_id }}

      - name: Hex audit (retired packages and advisories)
        run: mix hex.audit

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Dependency audit
        run: mix deps.audit --ignore-file config/mix_audit.ignore

      - name: Check unused deps
        run: mix deps.unlock --check-unused

  deploy:
    name: Deploy app sandbox (gate)
    runs-on: ubuntu-latest
    needs: [test, formatting, credo, security]
    outputs:
      skip: ${{ steps.sandbox_skip.outputs.skip }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - id: sandbox_skip
        name: Skip Fly deploy (stale run, or v* tag on commit)
        run: |
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"

          if [ "$MAIN_HEAD" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale run: origin/main is at ${MAIN_HEAD}, not ${GITHUB_SHA}."
            exit 0
          fi

          if git tag --points-at "$GITHUB_SHA" | grep -qE '^v[0-9]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v* tag on this commit — sandbox Fly deploy runs only in Deploy Production."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

  deploy_sandbox:
    name: Deploy app sandbox
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.outputs.skip != 'true'
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node 24 runtime (post v1.5)
      - name: Verify Fly token can access sandbox app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-sandbox

      - name: Compute version and check staleness
        id: version
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale run — main has moved on, skipping sandbox deploy."
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$VERSION_TAG" ]; then
            COMMITS=$(git rev-list --count "${VERSION_TAG}..HEAD")
            VERSION="${VERSION_TAG}-${COMMITS}-${GIT_HASH}"
          else
            VERSION="unknown-${GIT_HASH}"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `flyctl auth docker` tokens expire after 5 minutes, and a cold-cache build of
      # this Dockerfile can take longer than that. Build (and warm the GHA layer cache)
      # here, before authenticating, so the later push always replays from a warm
      # cache and finishes in seconds regardless of how long this step took.
      - name: Build image (warm cache)
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: etc/docker/Dockerfile
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=main-app
          cache-to: type=gha,mode=max,scope=main-app

      - name: Log in to Fly registry
        if: steps.version.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Push image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: etc/docker/Dockerfile
          push: true
          tags: registry.fly.io/ysc-sandbox:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=main-app

      - name: Deploy to Fly.io sandbox
        if: steps.version.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --image registry.fly.io/ysc-sandbox:${{ steps.version.outputs.version }} \
            -a ysc-sandbox \
            -c etc/fly/fly-sandbox.toml \
            --image-label "${{ steps.version.outputs.version }}"

  deploy_query_console_sandbox:
    name: Deploy query console sandbox
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.outputs.skip != 'true'
    concurrency:
      group: deploy-query-console-sandbox
      cancel-in-progress: false
    defaults:
      run:
        working-directory: query_console
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node 24 runtime (post v1.5)
      - name: Verify Fly token can access query console sandbox
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-query-console-sandbox

      - name: Compute version and check staleness
        id: version
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale run — main has moved on, skipping query console sandbox deploy."
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$VERSION_TAG" ]; then
            COMMITS=$(git rev-list --count "${VERSION_TAG}..HEAD")
            VERSION="${VERSION_TAG}-${COMMITS}-${GIT_HASH}"
          else
            VERSION="unknown-${GIT_HASH}"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `flyctl auth docker` tokens expire after 5 minutes, and a cold-cache build of
      # this Dockerfile can take longer than that. Build (and warm the GHA layer cache)
      # here, before authenticating, so the later push always replays from a warm
      # cache and finishes in seconds regardless of how long this step took.
      - name: Build image (warm cache)
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: query_console
          file: query_console/Dockerfile
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=query-console
          cache-to: type=gha,mode=max,scope=query-console

      - name: Log in to Fly registry
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Push image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: query_console
          file: query_console/Dockerfile
          push: true
          tags: registry.fly.io/ysc-query-console-sandbox:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=query-console

      - name: Deploy query console to Fly.io sandbox
        if: steps.version.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --image registry.fly.io/ysc-query-console-sandbox:${{ steps.version.outputs.version }} \
            -a ysc-query-console-sandbox \
            -c fly.sandbox.toml \
            --image-label "${{ steps.version.outputs.version }}"
