# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# CI runs tests, linter, and mix deps.audit in parallel; deploy only runs if all CI passes on main branch.
# Production: tag push (v*) → .github/workflows/fly-deploy-prod.yml (sandbox deploy gate, then prod; CI not duplicated there).
# If a v* tag already points at the commit after CI, the Fly deploy job is skipped so only Deploy
# Production deploys sandbox (one deploy, no duplicate work). The gate job still runs so branch checks stay green.
# Only deploy_sandbox uses the deploy-sandbox concurrency group — the gate job must not, or it cancels
# in-progress Deploy Production sandbox deploys on release (main push + tag push from release.sh).
# CI deploy_sandbox uses cancel-in-progress: false so a release deploy is never cancelled by CI;
# Deploy Production keeps cancel-in-progress: true and wins the shared deploy-sandbox group.
#
# Secrets: use FLY_SANDBOX_API_TOKEN for the sandbox Fly org (recommended). If unset, FLY_API_TOKEN
# is used so existing repos keep working — do not point FLY_API_TOKEN at production.

name: CI and Deploy Sandbox
on:
  push:
    branches:
      - main

# Cancel superseded runs when main moves on (e.g. merge immediately before release.sh).
# Without this, a stale run can finish CI and reach deploy_sandbox after a newer push/tag.
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        env:
          MIX_ENV: test
        run: |
          mix deps.compile
          mix compile --warnings-as-errors

      - name: Run tests and generate lcov report
        env:
          MIX_ENV: test
        run: mix coveralls.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          fail_ci_if_error: false
          verbose: true

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check format
        run: mix format --check-formatted

  credo:
    name: Code Quality (Credo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-credo-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-credo-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Elixir
        id: setup-beam
        uses: ./.github/actions/setup-elixir

      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-security-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-security-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Hex audit (retired packages and advisories)
        run: mix hex.audit

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Dependency audit
        run: mix deps.audit --ignore-file config/mix_audit.ignore

      - name: Check unused deps
        run: mix deps.unlock --check-unused

  deploy:
    name: Deploy app sandbox (gate)
    runs-on: ubuntu-latest
    needs: [test, formatting, credo, security]
    outputs:
      skip: ${{ steps.sandbox_skip.outputs.skip }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - id: sandbox_skip
        name: Skip Fly deploy (stale run, or v* tag on commit)
        run: |
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"

          if [ "$MAIN_HEAD" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale run: origin/main is at ${MAIN_HEAD}, not ${GITHUB_SHA}."
            exit 0
          fi

          if git tag --points-at "$GITHUB_SHA" | grep -qE '^v[0-9]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v* tag on this commit — sandbox Fly deploy runs only in Deploy Production."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

  deploy_sandbox:
    name: Deploy app sandbox
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.outputs.skip != 'true'
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # Node 24 runtime (post v1.5)
      - name: Verify Fly token can access sandbox app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: bash etc/scripts/fly_verify_app_access.sh ysc-sandbox
      - name: Deploy to Fly.io sandbox
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Stale run — main has moved on, skipping sandbox deploy."
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$VERSION_TAG" ]; then
            COMMITS=$(git rev-list --count "${VERSION_TAG}..HEAD")
            VERSION="${VERSION_TAG}-${COMMITS}-${GIT_HASH}"
          else
            VERSION="unknown-${GIT_HASH}"
          fi
          flyctl deploy --dockerfile etc/docker/Dockerfile -a ysc-sandbox -c etc/fly/fly-sandbox.toml --local-only --build-arg BUILD_VERSION="$VERSION" --image-label "$VERSION"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SANDBOX_API_TOKEN || secrets.FLY_API_TOKEN }}
