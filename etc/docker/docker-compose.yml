services:
  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ysc_dev
    command: postgres -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ysc.org
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - DEBUG=${DEBUG:-0}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot init: creates S3 buckets when LocalStack is ready (no awslocal needed on host)
  localstack-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.15.0
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ../config/s3_bucket_cors_rules.json:/config/s3_bucket_cors_rules.json:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url=http://localstack:4566 s3api create-bucket --bucket media || true
        aws --endpoint-url=http://localstack:4566 s3api put-bucket-cors --bucket media --cors-configuration file:///config/s3_bucket_cors_rules.json || true
        aws --endpoint-url=http://localstack:4566 s3api create-bucket --bucket expense-reports || true
        echo "S3 buckets (media, expense-reports) initialized"

volumes:
  pgadmin-data:
