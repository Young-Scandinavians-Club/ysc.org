services:
  postgres:
    image: postgres:17.4-alpine@sha256:7062a2109c4b51f3c792c7ea01e83ed12ef9a980886e3b3d380a7d2e5f6ce3f5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ysc_dev
    command: postgres -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  # MinIO stopped publishing minio/minio and minio/mc to Docker Hub (archived the
  # project Feb 2026); those images now return "pull access denied" for every tag,
  # including old pinned digests. Using Chainguard's maintained rebuild instead —
  # https://www.chainguard.dev/unchained/secure-and-free-minio-chainguard-containers
  # `-dev` variant is used (not the minimal default) because it ships wget/sh, which
  # this service's own healthcheck and the minio-init script below need.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:25ba8c00148194630f699ef6d93d0274c5c015c5558b5acb406e0ea70ec9b11f
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://localhost:9000/minio/health/live",
      ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:021ac36a006a29aea480d7f7acc5976021d93f5740f9486c7c3d5673103d2d38
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/media --ignore-existing &&
        mc mb local/expense-reports --ignore-existing &&
        mc mb local/app-resources --ignore-existing &&
        mc mb local/avatars --ignore-existing &&
        mc anonymous set public local/media &&
        mc anonymous set public local/avatars &&
        echo "S3 buckets (media, expense-reports, app-resources, avatars) initialized"
