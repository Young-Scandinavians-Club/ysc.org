# fly.toml app configuration file generated for ysc-prod on 2026-04-24T09:37:23-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ysc-prod'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
  # Relative to this file (etc/fly/), not repo root — see fly.io monorepo / -c path rules.
  dockerfile = "../docker/Dockerfile"

[deploy]
  # RELEASE_COMMAND=1: minimal runtime (see config/runtime.exs) so migrate/seed need only DB + core config.
  # DATABASE_URL must be set for each step (Fly expands ${RAW_DATABASE_URL} before the shell runs).
  release_command = "/bin/sh -lc 'DATABASE_URL=${RAW_DATABASE_URL} env RELEASE_COMMAND=1 /app/bin/migrate && DATABASE_URL=${RAW_DATABASE_URL} env RELEASE_COMMAND=1 /app/bin/seed'"

