[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Rolling deploys need at least two started machines; CI enforces this before release.
  min_machines_running = 2
  max_machines_running = 3
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 800
    soft_limit = 400

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1

[[metrics]]
  port = 4000
  path = '/metrics'
