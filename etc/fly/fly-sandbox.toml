# fly.toml app configuration file generated for ysc-sandbox on 2025-11-14T08:35:48-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ysc-sandbox'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[deploy]
# RELEASE_COMMAND=1 for migrate + seed — same minimal runtime as prod (config/runtime.exs).
release_command = "/bin/sh -lc 'DATABASE_URL=${RAW_DATABASE_URL} env RELEASE_COMMAND=1 /app/bin/migrate && DATABASE_URL=${RAW_DATABASE_URL} env RELEASE_COMMAND=1 /app/bin/seed'"

[env]
APPLE_WALLET_MEMBERSHIP_PASS_TYPE_ID = 'pass.org.ysc.membership'
APPLE_WALLET_ORG_NAME = 'Young Scandinavians Club'
APPLE_WALLET_TEAM_ID = 'FAN7NBS7AB'
APPLE_WALLET_TICKET_PASS_TYPE_ID = 'pass.org.ysc.tickets'
APP_ENV = 'sandbox'
APP_RESOURCES_BUCKET_NAME = 'ysc-app-resources'
AVATARS_BUCKET_NAME = 'ysc-sandbox-avatars'
CHROMIC_PDF_ENABLED = 'true'
ECTO_IPV6 = 'true'
EMAIL_ADMIN = 'admin+sandbox@ysc.org'
EMAIL_BOARD = 'board+sandbox@ysc.org'
EMAIL_CLEAR_LAKE = 'clearlake+sandbox@ysc.org'
EMAIL_CONTACT = 'info+sandbox@ysc.org'
EMAIL_FROM = 'info+sandbox@ysc.org'
EMAIL_FROM_NAME = 'YSC Test Sandbox'
EMAIL_MEMBERSHIP = 'memberships+sandbox@ysc.org'
EMAIL_TAHOE = 'tahoe+sandbox@ysc.org'
EMAIL_VOLUNTEER = 'volunteer+sandbox@ysc.org'
ENVIRONMENT = 'sandbox'
ERL_AFLAGS = '-proto_dist inet6_tcp'
EXPENSE_REPORTS_BUCKET_NAME = 'ysc-sandbox-expense-reports-2'
FLOWROUTE_FORCE_ENABLE = 'true'
LOG_LEVEL = 'debug'
PHX_HOST = 'ysc-sandbox.fly.dev'
PHX_SERVER = 'true'
PORT = '4000'
QUICKBOOKS_APP_ID = 'f746318b-1165-4e61-b808-3134e5c3afcc'
QUICKBOOKS_BANK_ACCOUNT_ID = '1150040010'
QUICKBOOKS_BASE_URL = 'https://sandbox-quickbooks.api.intuit.com/v3'
QUICKBOOKS_REALM_ID = '9341455772023176'
QUICKBOOKS_STRIPE_ACCOUNT_ID = '1150040000'
QUICKBOOKS_SYSTEM_CUSTOMER_ID = '61'
SNS_TOPIC_ARN = 'arn:aws:sns:us-west-1:202235431647:ses-newsletter-events'
STRIPE_FAMILY_PRICE_ID = 'price_1SUZVcREiftrEncLSSYnzi6N'
STRIPE_SINGLE_PRICE_ID = 'price_1SUZVAREiftrEncLCHpFzbJY'
