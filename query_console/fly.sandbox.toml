# Sandbox Fly app for the standalone SQL query console.
# Deployed on every push to main (see .github/workflows/fly-deploy.yml).

app = "ysc-query-console-sandbox"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[deploy]
release_command = "/app/bin/migrate"

[env]
PHX_HOST = "ysc-query-console-sandbox.fly.dev"
PORT = "4000"
ECTO_IPV6 = "true"

# Scale to zero when idle. The app also calls System.stop/1 after
# SHUTDOWN_WHEN_INACTIVE_MS (default 10m) with no HTTP/LiveView clients so the
# Machine fully stops; auto_start wakes it on the next request.
[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "30s"
method = "GET"
path = "/up"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
